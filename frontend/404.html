<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="images/tomshead.ico">
    <title>Page Not Found</title>
    <style media="screen">
      body { background: #0f172a; color: #e5e7eb; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      #message { background: #111827; max-width: 400px; padding: 32px 24px 24px; border-radius: 16px; border: 1px solid #1f2937; box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
      #message h2 { color: #38bdf8; font-weight: bold; font-size: 16px; margin: 0 0 8px; }
      #message h1 { font-size: 22px; font-weight: 600; color: #f8fafc; margin: 0 0 16px;}
      #message p { line-height: 140%; margin: 16px 0 24px; font-size: 14px; color: #94a3b8; }
      #message a { display: block; text-align: center; background: #38bdf8; font-weight: 600; text-decoration: none; color: #0b122a; padding: 12px 16px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>404</h2>
      <h1>Page Not Found</h1>
      <p>The specified file was not found on this server. Please check the URL for mistakes and try again.</p>
      <a href="index.html">Return to Dashboard</a>
    </div>
  </body>
</html>
